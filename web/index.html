<meta name="description" content="세계 곳곳의 가위바위보 변종을 모았습니다. 누가 누구를 이기는지 고리 그림으로 보고, 컴퓨터나 친구와 바로 겨룹니다.">
<meta name="theme-color" content="#f1f3f8">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Ultimate RSP — 궁극의 가위바위보">
<meta property="og:description" content="가위바위보 변종을 모았습니다. 누가 누구를 이기는지 보고 바로 겨룹니다.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script>
  // 그리기 전에 밝은·어두운 화면을 정한다(번쩍임을 막는다). app.js 의 applyScheme 과 같은 판단
  (function () {
    var s = "system", d = false;
    try { s = JSON.parse(localStorage.getItem("ursp.set.scheme")) || "system"; } catch (e) {}
    try { d = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}
    document.documentElement.dataset.scheme = d ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = d ? "#0f1126" : "#f1f3f8";
    // 언어도 미리 정한다(i18n.js 의 detect 와 같은 판단)
    var l = null;
    try { l = JSON.parse(localStorage.getItem("ursp.set.lang")); } catch (e) {}
    if (l !== "ko" && l !== "en") l = /^ko\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "ko") ? "ko" : "en";
    document.documentElement.lang = l;
  })();
</script>
