<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate RSP — 세상의 가위바위보</title>
<meta name="description" content="세계 곳곳의 가위바위보 변종을 모아, 누가 누구를 이기는지 고리 그림으로 보고 컴퓨터와 바로 겨룬다.">
<meta name="theme-color" content="#f1f3f8">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Ultimate RSP — 세상의 가위바위보">
<meta property="og:description" content="가위바위보 변종을 모아 규칙을 그림으로 보고 컴퓨터와 겨룬다.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script>
  // 그리기 전에 밝은·어두운 화면을 정한다(번쩍임을 막는다). app.js 의 applyScheme 과 같은 판단
  (function () {
    var s = "system", d = false;
    try { s = JSON.parse(localStorage.getItem("ursp.set.scheme")) || "system"; } catch (e) {}
    try { d = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}
    document.documentElement.dataset.scheme = d ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = d ? "#0f1126" : "#f1f3f8";
  })();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
