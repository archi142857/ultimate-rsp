# 웹 화면(web/)을 GitHub Pages 로 올린다.
# 켜는 법(한 번만): 레포 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로.
# main 에 푸시할 때마다 테스트를 돌리고, 통과하면 web/ 을 _site/ 로 옮겨 올린다.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중인 것은 끝까지 간다(GitHub 기본 틀과 같게). 그 사이에 쌓인 실행만 건너뛴다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Build site
        # 표준 라이브러리만 쓴다. 스크립트·스타일 주소에 판(?v=)을 붙여
        # 배포 직후 새로고침해도 옛 스크립트가 섞이지 않게 한다
        run: python3 scripts/stamp.py web _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
