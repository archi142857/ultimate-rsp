# 온라인 대전 서버(server/)를 Cloudflare Workers 로 올린다.
# 필요한 것(한 번만): 레포 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# main 에 푸시할 때 서버나 서버가 import 하는 판정 코드(web/js/core·data·games, i18n)가 바뀌면 테스트를 돌리고 배포한다.

name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/js/core/**"
      - "web/js/data/**"
      - "web/js/games/**"
      - "web/js/i18n.js"
      - "web/js/i18n/**"
      - ".github/workflows/server.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# 배포는 하나씩 끝까지 간다
concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        # 화면 시험과 서버 시험(server/tests)을 다 돌린다. 서버 시험은 Cloudflare 없이 돈다
        run: node --test
      - name: Install wrangler
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4.158.0"
          command: deploy
      - name: Check
        # 처음 배포한 직후에는 주소가 열리기까지 몇 초 걸릴 수 있다
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://ultimate-rsp.sanger-lee138.workers.dev/api/hello?v=1"; then exit 0; fi
            sleep 10
          done
          exit 1
